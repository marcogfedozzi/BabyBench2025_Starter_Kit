_target_: babybench.predictors.ForwardInverseSurprisePredictor
in_keys:
  - touch
dtype: ${type:torch.float32}

feat_extractor:
  _target_: torchrl.modules.MLP
  out_features: 256
  num_cells: [1024,512]
  activation_class: ${cls:torch.nn.ReLU} # custom resolver
  device: ${device}
  dropout: 0.0

forward_model:
  _target_: torchrl.modules.MLP
  out_features: ${predictor.feat_extractor.out_features}
  num_cells: [512,1024]
  activation_class: ${cls:torch.nn.ReLU} # custom resolver
  device: ${device}
  dropout: 0.0

inverse_model:
  _target_: torchrl.modules.MLP
  out_features: ${env_act_shape:}
  num_cells: [512,256]
  activation_class: ${cls:torch.nn.ReLU} # custom resolver
  device: ${device}
  dropout: 0.0

forward_loss_fn:
  _target_: torch.nn.CosineEmbeddingLoss
  margin: 0.0
  reduction: mean

inverse_loss_fn:
  _target_: torch.nn.MSELoss
  reduction: mean

optim:
  _partial_: true
  _target_: torch.optim.Adam
  lr: 1e-4

clip_grad: 1.0

action_low: ${env_act_space_low:} # custom resolver
action_high: ${env_act_space_high:} # custom resolver

beta: 0.2
eta: 0.1
detach_next_features: true
clamp_surprise: 10