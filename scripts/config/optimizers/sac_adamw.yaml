# NOTE: the naming convention is important for proper update of the optimizers!

# It should follow the convention:
# optimizer_<lossname>
# where lossname is(are) the name of the item(s) generated from the loss module chosen, minus the "loss_" prefix.
# For SACLoss the losses are: loss_actor, loss_qvalue, loss_alpha -> actor, qvalue, alpha -> optimizer_actor, ...

optimizer_actor:
  _target_: torch.optim.AdamW
  lr: 1e-4
  fused: true
  weight_decay: 1e-3

optimizer_qvalue:
  _target_: torch.optim.AdamW
  fused: true
  lr: 3e-4
  weight_decay: 1e-3

optimizer_alpha:
  _target_: torch.optim.Adam
  fused: true
  lr: 3e-5

clip_actor: 1.0

clip_qvalue: 0.5

clip_alpha: 1.0