[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "babybench"
version = "0.1.0.dev0"
authors = [
    { name="Marco Gabriele Fedozzi", email="marco.fedozzi@iit.it" },
    { name="Leticia Berto", email="leticia.berto@postgrad.manchester.ac.uk" }
]
description = "Reinforcement Learning toolbox for BabyBench2025"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent"
]

dependencies = [
    "numpy==2.0.2",
    "matplotlib==3.9.4",    
    "imageio==2.37.0",
    "scipy==1.13.1",
    "trimesh==4.6.2",
    "pyyaml==6.0.2",
    "cachetools==5.5.1",
    "CacheToolsUtils==6.0",
    "networkx==3.2.1",
    "rtree==1.3.0",
    "mujoco==3.3.0",
    "gymnasium==0.28.1",
    "stable-baselines3==2.3.2",
    "opencv-python-headless==4.11.0.86",
    "scikit-image==0.24.0",
    "hydra-core==1.3.2",
    "torch==2.7.1",
    "torchrl==0.9.2",
    "lazy_loader==0.4",
    "glfw==2.9.0",
    "wandb"
    # Note: Editable installs like '-e ./MIMo' are not supported in pyproject.toml dependencies.
]

[project.urls]
Homepage = "https://github.com/marcogfedozzi/BabyBench2025_Starter_Kit"

[tool.setuptools.packages.find]
where = ["."]
include = ["babybench*"]
